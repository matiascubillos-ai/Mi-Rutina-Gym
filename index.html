<style>
/* Layout: una columna de 440px máx., barra de pestañas fija abajo, hoja de calendario superpuesta */
:root{--bg:#0e1116;--card:#171b22;--card2:#1f2530;--line:#2a313d;--tx:#e8ecf1;--mut:#8f99a8;--acc:#f2c14e;--acc2:#4cc9f0;--ok:#3ddc84;--warn:#ffb020;--bad:#ff5a5f;--fb:#5b8cff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding-block:0 160px}
.wrap{max-width:440px;margin:0 auto;padding:12px 16px}
h1{font-size:22px;margin:4px 0;text-wrap:balance}
h2{font-size:17px;margin:0 0 6px}
h3{margin:0;font-size:16px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrapr{flex-wrap:wrap}
.chip{display:inline-block;font-size:12px;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--mut);margin:4px 4px 0 0}
.chip.acc{background:rgba(242,193,78,.16);color:var(--acc)}
.chip.hol{background:rgba(255,90,95,.15);color:var(--bad)}
.chip.ok{background:rgba(61,220,132,.14);color:var(--ok)}
.chip.warn{background:rgba(255,176,32,.14);color:var(--warn)}
button{font:inherit;color:inherit;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);color:#141414;border:0;font-weight:700}
button.sm{padding:6px 12px;font-size:14px;border-radius:10px}
button.xs{padding:4px 9px;font-size:13px;border-radius:8px}
button.ghost{background:none;border:0;color:var(--acc2);padding:8px 0;font-size:14px}
button.full{width:100%}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;width:100%;min-width:0}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--ok);flex:none}
label.mut input,label.mut select{margin-top:4px}
textarea{min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.alert{border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px;border-left:4px solid}
.a-up{background:rgba(61,220,132,.1);border-color:var(--ok)}
.a-warn{background:rgba(255,176,32,.1);border-color:var(--warn)}
.a-bad{background:rgba(255,90,95,.1);border-color:var(--bad)}
.a-info{background:rgba(76,201,240,.1);border-color:var(--acc2)}
.sets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.set{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center}
.set input[inputmode]{text-align:center;padding:6px 2px}
.set label{display:flex;justify-content:center;margin-top:6px}
.set.done{border-color:var(--ok);background:rgba(61,220,132,.08)}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.det{margin-top:6px;border-top:1px dashed var(--line);padding-top:10px;font-size:14px}
.det ul{margin:4px 0 10px;padding-left:18px}
.bm{width:100%;max-width:280px;display:block;margin:0 auto}
.mn{fill:#343c4a}.mp{fill:#f2c14e}.ms{fill:#f2c14e;opacity:.4}
.prog{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--acc);transition:width .3s}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,17,22,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs div{display:flex;max-width:440px;width:100%}
.tabs button{flex:1;min-width:0;background:none;border:0;font-size:10.5px;color:var(--mut);padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-size:19px}
.tabs button.on{color:var(--acc)}
.save{position:fixed;right:max(16px,calc((100vw - 440px)/2 + 16px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 6px 20px rgba(0,0,0,.5);border-radius:999px;padding:11px 16px;font-size:14px}
.save.dirty{background:var(--warn)}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));background:var(--acc2);color:#0b1620;font-weight:700;border-radius:16px;padding:10px 16px;z-index:16;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer}
.timer.tr{background:var(--acc)}
.timer small{display:block;font-weight:500;font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px 14px;z-index:40;font-size:14px;max-width:90vw}
/* Semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.wd{background:var(--card2);border:2px solid transparent;border-radius:12px;padding:6px 0 5px;text-align:center;cursor:pointer;min-width:0;color:var(--tx)}
.wd b{display:block;font-size:15px}
.wd span,.wd small{display:block;font-size:10px;color:var(--mut);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wd.sel{border-color:var(--acc)}
.wd.today b{color:var(--acc)}
.done{--st:rgba(61,220,132,.32)}.partial{--st:rgba(255,176,32,.32)}.missed{--st:rgba(255,90,95,.22)}.sp{--st:rgba(91,140,255,.38)}
.wd.done,.wd.partial,.wd.missed,.wd.sp,.cal .d.done,.cal .d.partial,.cal .d.missed,.cal .d.sp{background:var(--st)}
/* Hoja del mes */
.sheet{position:fixed;inset:0 0 calc(62px + env(safe-area-inset-bottom,0px)) 0;z-index:18;background:rgba(5,7,10,.7);display:flex;justify-content:center;align-items:flex-end}
.sheet .in{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:440px;max-height:100%;overflow:auto;padding:12px 16px 20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--mut)}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;position:relative;border:2px solid transparent;cursor:pointer;color:var(--tx);padding:0}
.cal .d.today{border-color:var(--acc)}
.cal .d.hol::after,.wd.hol::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
.wd{position:relative}
.cal .d small{font-size:9px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:4px;margin:6px 10px 0 0;font-size:12px;color:var(--mut)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.dots{display:flex;gap:3px;margin-top:8px}
.dots i{flex:1;height:14px;border-radius:4px;background:var(--card2)}
.dots i.on{background:var(--ok)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;align-items:center;margin-top:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{border-radius:999px;padding:6px 12px;font-size:14px;background:var(--card2);border:1px solid var(--line);color:var(--tx)}
.pill.on{background:rgba(242,193,78,.18);border-color:var(--acc);color:var(--acc)}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{color:var(--mut);font-size:13px}
.form{display:grid;gap:12px}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;padding:0 14px}
details>summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details>summary::after{content:"＋";color:var(--mut)}
details[open]>summary::after{content:"－"}
details>div{padding-bottom:14px;font-size:14px}
dl{margin:0}dt{font-weight:700;margin-top:10px}dd{margin:2px 0 0;color:var(--tx);opacity:.9}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.exrow .ctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px;grid-column:1/-1}
.exrow .ctl label{font-size:11px;color:var(--mut)}
.exrow .ctl input,.exrow .ctl select{padding:6px;font-size:15px}
.mv{display:flex;gap:4px}
.daymap{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
.daymap div{background:var(--card2);border-radius:10px;padding:6px 2px;text-align:center;font-size:11px;min-width:0}
.daymap div.on{background:rgba(242,193,78,.16);color:var(--acc)}
.daymap div.sp{background:rgba(91,140,255,.3)}
.daymap b{display:block;font-size:12px;color:var(--tx)}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.kpi div{background:var(--card2);border-radius:12px;padding:8px;text-align:center}
.kpi b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap" id="app"></div>
<div id="sheet" hidden></div>
<div class="timer" id="timer" hidden></div>
<div class="toast" id="toast" hidden></div>

</div></nav>

const GROUPS={pecho:'Pecho',espalda:'Espalda',hombros:'Hombros',biceps:'Bíceps',triceps:'Tríceps',cuadriceps:'Cuádriceps',isquios:'Isquios y glúteos',pantorrillas:'Pantorrillas',core:'Core / abdomen'};
const LIB={};
function X(id,n,g,m,t,eq,inc,k,p,sc,cu,mm,yt,o){LIB[id]=Object.assign({id,n,g,m,t,eq,inc,k,p,sc,cu,mm,yt},o||{})}
X('press_banca','Press banca con barra','pecho','Pectoral medio, tríceps','c','bb',2.5,.5,['pecho'],['triceps','deltA'],['Escápulas juntas y abajo, leve arco lumbar.','Baja la barra a la línea del pezón con codos a 45–60°.','Pies firmes; empuja en línea recta.'],['Piensa en juntar los codos hacia el centro, no en empujar la barra.','Siente el estiramiento del pecho abajo antes de subir.'],'press banca con barra técnica correcta');

X('press_incl_maq','Press inclinado en máquina o Smith','pecho','Pectoral superior','c','mq',2.5,.45,['pecho'],['deltA','triceps'],['Agarre a la altura del pecho alto.','Escápulas atrás y abajo.','Rango completo.'],['Siente el estiramiento abajo y junta el pecho arriba.'],'press inclinado maquina smith técnica');
X('press_maq','Press de pecho en máquina','pecho','Pectoral medio, tríceps','c','mq',2.5,.5,['pecho'],['triceps','deltA'],['Asiento con el agarre a media altura del pecho.','No bloquees los codos.'],['Junta los brazos como si abrazaras un árbol.'],'press de pecho en maquina técnica');
X('fondos','Fondos en paralelas','pecho','Pectoral inferior, tríceps','c','bw',2.5,0,['pecho','triceps'],['deltA'],['Inclina el torso adelante.','Baja hasta que el hombro quede a la altura del codo.','Usa asistencia si no logras 6 reps.'],['Empuja el suelo lejos con el pecho.'],'fondos en paralelas pecho técnica');
X('aperturas','Aperturas en polea','pecho','Pectoral (aislado)','i','cb',2.5,.08,['pecho'],['deltA'],['Codos levemente flexionados y fijos.','Abre hasta estirar el pecho.','Cierra en arco.'],['Intenta juntar los codos, no las manos.'],'aperturas en polea cruce técnica',{ps:1});

X('curl_incl','Curl inclinado con mancuernas','biceps','Bíceps (cabeza larga)','i','db',1,.07,['biceps'],['antebrazo'],['Banco a 45–60°, brazos colgando detrás del torso.','Codos quietos.','Baja lento (3 s).'],['Gira el meñique hacia afuera al subir y aprieta 1 s.'],'curl inclinado mancuernas técnica');

const tr=trend(d);if(tr)A.push(tr);return A}
function avgB(a,b){const v=Object.keys(S.body).filter(k=>k>=a&&k<=b&&S.body[k].kg!==''&&S.body[k].kg!=null).map(k=>+S.body[k].kg);return v.length>=2?v.reduce((x,y)=>x+y,0)/v.length:null}
function trend(d){const c=avgB(add(d,-6),d),p=avgB(add(d,-13),add(d,-7));if(c===null||p===null)return null;const l=p-c,g=P().goal||(S.plan&&S.plan.goal);
if(g==='musculo'){if(l>0.1)return['warn',`⚖️ Bajaste ${l.toFixed(2)} kg esta semana. Para ganar músculo suma 150–200 kcal.`];return['up',`⚖️ Tendencia: ${l<=0?'+':'−'}${Math.abs(l).toFixed(2)} kg/semana (promedio ${c.toFixed(1)} kg).`]}
if(!['grasa','recomp'].includes(g))return null;
if(l<0)return['warn',`⚖️ Tu promedio semanal subió ${Math.abs(l).toFixed(2)} kg. Revisa calorías y fin de semana; si se repite, resta 150–200 kcal.`];
if(l<0.4&&g==='grasa')return['warn',`⚖️ Bajaste ${l.toFixed(2)} kg/semana (meta 0,5–1 % de tu peso). Si se repite 2 semanas, resta 150–200 kcal.`];
if(l>1)return['warn',`⚖️ Bajaste ${l.toFixed(2)} kg/semana: muy rápido. Suma 150–200 kcal para proteger tu músculo.`];
return['up',`⚖️ Vas bien: −${l.toFixed(2)} kg/semana (promedio ${c.toFixed(1)} kg).`]}

const UPG=['pecho','espalda','hombros','biceps','triceps'],LOWG=['cuadriceps','isquios','pantorrillas'];
const MOB={up:['Círculos de brazos: 10 adelante y 10 atrás','Rotación externa de hombro con banda o polea liviana: 10 por lado','Flexiones en la pared o con rodillas: 8'],low:['Balanceo de pierna adelante-atrás y lateral: 10 por lado','Sentadilla con peso corporal, lenta: 10','Puente de glúteo: 10'],core:['Gato-camello: 8']};
const STRE={pecho:'Pecho: antebrazo en el marco de una puerta, gira el torso hacia afuera',espalda:'Espalda: cuélgate de una barra o toma un soporte y lleva la cadera atrás',hombros:'Hombros: cruza un brazo frente al pecho y acércalo con el otro',biceps:'Bíceps: palma en la pared con el brazo estirado, gira el torso hacia afuera',triceps:'Tríceps: mano detrás de la cabeza, empuja suave el codo con la otra',cuadriceps:'Cuádriceps: de pie, lleva el talón al glúteo',isquios:'Isquios y glúteos: talón sobre un banco con la pierna estirada, inclina el torso; luego "figura 4" sentado',pantorrillas:'Pantorrillas: manos en la pared, pierna atrás estirada y talón al suelo',core:'Abdomen: cobra suave boca abajo'};
const dayGroups=dp=>[...new Set(dp.ex.map(e=>LIB[e.id]&&LIB[e.id].g).filter(Boolean))];
const wuDone=l=>!!(l&&l.wu&&l.wu.g&&l.wu.m&&l.wu.a),cdDone=l=>!!(l&&l.cd&&l.cd.c&&l.cd.s);
function chk(a,k,on,txt,sub){return `<label class="row" style="align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)"><input type="checkbox" data-a="${a}" data-k="${k}" ${on?'checked':''}><span style="font-size:14px">${txt}${sub?`<span class="mut" style="display:block;margin-top:2px">${sub}</span>`:''}</span></label>`}
function warmCard(d,dp){const l=S.logs[d],w=(l&&l.wu)||{},gs=dayGroups(dp),z=zones();const mob=[].concat(gs.some(g=>UPG.includes(g))?MOB.up:[],gs.some(g=>LOWG.includes(g))?MOB.low:[],MOB.core);
return `<div class="card" id="warm"><div class="row between"><h3>🔥 Calentamiento · 8 min</h3>${wuDone(l)?'<span class="chip ok">Listo</span>':''}</div>
${chk('wu','g',w.g,`General: 5 min de bici o elíptica suave (${Math.round(z.fc*.5)}–${Math.round(z.fc*.6)} lpm)`,'Debes poder conversar. Sube la temperatura del músculo y las pulsaciones.')}
${chk('wu','m',w.m,'Movilidad dinámica, sin estiramientos largos',mob.join('<br>'))}
${chk('wu','a',w.a,'Series de aproximación en el primer ejercicio de cada grupo','Las verás calculadas en la tarjeta del ejercicio. No cuentan como series efectivas.')}</div>`}
function coolCard(d,dp){const l=S.logs[d],c=(l&&l.cd)||{},gs=dayGroups(dp);
return `<div class="card" id="cool"><div class="row between"><h3>🧘 Vuelta a la calma · 5 min</h3>${cdDone(l)?'<span class="chip ok">Listo</span>':''}</div>
${chk('cd','c',c.c,'2–3 min caminando suave','Deja que bajen las pulsaciones antes de estirar.')}
${chk('cd','s',c.s,'Estira lo que entrenaste: 2 × 20–30 s por lado, sin rebotes ni dolor',gs.map(g=>STRE[g]).filter(Boolean).join('<br>'))}
<div class="mut" style="margin-top:6px">Estirar después no evita el dolor muscular del día siguiente, pero hacerlo 2–3 veces por semana mejora tu flexibilidad.</div></div>`}
function approach(it,L,x,s,sw){if(L.t!=='c')return'';if(L.eq==='bw')return '<div class="mut" style="margin-top:6px">🔥 Aproximación: 1 serie fácil de 5 reps antes de empezar.</div>';
const W=+x.w||(s?s.w:sw);if(!W)return '<div class="mut" style="margin-top:6px">🔥 Aproximación: 2 series livianas (10 y 5 reps) antes de la primera serie efectiva.</div>';
const st=[[.5,10],[.7,5]].concat(it.max<=6?[[.85,3]]:[]);return `<div class="mut" style="margin-top:6px">🔥 Aproximación (no cuentan como series): ${st.map(([f,r])=>`${r} × ${nf(roundW(W*f,L.eq,L.bar))} kg`).join(' · ')}</div>`}

function weekStrip(){const m=monday(sel),t=todayCL();let h='';for(let i=0;i<7;i++){const d=add(m,i),dp=dayPlan(d),s=status(d);const c=['done','partial','missed','sp'].includes(s)?s:'';
h+=`<button class="wd ${c} ${d===sel?'sel':''} ${d===t?'today':''} ${FER[d]?'hol':''}" data-a="goto" data-d="${d}" aria-label="${fmt(d)}"><span>${DC[wd(d)]}</span><b>${D(d).getUTCDate()}</b><small>${dp?esc(dp.ab||''):(s==='sp'?'⚽':'—')}</small></button>`}return `<div class="week">${h}</div>`}
const mins=ms=>Math.round(ms/60000);
function sessBlock(d){const l=S.logs[d],dp=dayPlan(d);if(!dp)return'';const est=estMin(dp),t=todayCL();
if(!l||!l.t0)return d===t?`<div class="row between" style="margin-top:10px"><span class="mut">Estimado: ${est} min</span><button class="pri sm" data-a="sStart">▶ Iniciar sesión</button></div>`:'';

const m=mins(l.t1-l.t0),df=m-est;return `<div class="row between wrapr" style="margin-top:10px;gap:6px"><span>✅ Duró <b>${m} min</b> <span class="mut">(estimado ${est}; ${df>0?'+':''}${df} min)</span></span><label class="mut row" style="gap:6px">Corregir<input id="durReal" inputmode="numeric" data-a="durReal" value="${m}" style="width:64px"> min</label></div>`}
function pbar(d){const g=prog(d);if(!g)return'';const dp=dayPlan(d),pc=Math.round(g.p*100);const ST={done:'✅ Rutina cumplida',partial:'🟡 Rutina parcial',none:'⬜ Sin registrar',missed:'❌ No realizada',sp:'⚽ Deporte'};
return `<div class="row between"><b>${esc(dp.n)}</b><b style="color:var(--acc)">${pc}%</b></div><div class="prog" style="margin:8px 0"><i style="width:${pc}%"></i></div><div class="mut">${g.k}/${g.t} series y bloques · ${ST[status(d)]||''}</div>${sessBlock(d)}`}
function det(L){return `<div class="det">${bodyMap(L.p,L.sc)}<div class="mut" style="text-align:center;font-size:12px;margin-bottom:8px"><span style="color:var(--acc)">■</span> principal &nbsp; <span style="color:var(--acc);opacity:.45">■</span> secundario</div><b>Técnica</b><ul>${L.cu.map(x=>`<li>${x}</li>`).join('')}</ul><b>🧠 Conexión mente-músculo</b><ul>${L.mm.map(x=>`<li>${x}</li>`).join('')}<li>Antes de cada serie, contrae 3 s el músculo objetivo.</li></ul><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(L.yt)}" target="_blank" rel="noopener" style="color:var(--acc2)">▶ Ver video de la técnica</a></div>`}
function cardioCard(d,it){const x=exLog(d,it,false)||blankX(it),z=zones();const tz=it.z==='hiit'?`Fuerte ${z.h1}–${z.h2} lpm · suave ≤ ${z.hs} lpm`:`Zona 2: ${z.z1}–${z.z2} lpm (puedes hablar con frases cortas)`;let hc='';
if(x.hr!==''&&it.z==='z2'){const v=+x.hr;hc=v>z.z2?`<div class="alert a-warn">Sobre zona 2: baja el ritmo.</div>`:v<z.z1?`<div class="alert a-info">Bajo zona 2: sube un poco la intensidad.</div>`:`<div class="alert a-up">✅ En zona 2.</div>`}
return `<div class="card" id="ex-${it.id}"><div class="row between"><h3>❤️ ${esc(it.n)}</h3><input type="checkbox" aria-label="Cardio hecho" data-a="cdone" data-id="${it.id}" ${x.done?'checked':''}></div><span class="chip acc">Cardiovascular</span><span class="chip">${it.min} min</span><div class="mut" style="margin-top:6px">${tz}</div><div class="kg"><label class="mut">Minutos<input id="cm-${it.id}" inputmode="numeric" data-a="cmin" data-id="${it.id}" value="${esc(x.min)}" placeholder="${it.min}"></label><label class="mut">FC promedio<input id="ch-${it.id}" inputmode="numeric" data-a="chr" data-id="${it.id}" value="${esc(x.hr)}" placeholder="lpm"></label></div>${hc}</div>`}
function exCard(d,it,first){const L=LIB[it.id];if(!L)return'';const x=exLog(d,it,false)||blankX(it),o=openDet[it.id];const s=sugg(it,d),sw=s?null:startW(it);
const last=s?`Última (${fmtS(s.L.d)}): ${nf(s.L.w)} kg · ${s.L.r.map(v=>v??'–').join(' / ')}`:L.eq==='bw'?'Con tu peso corporal. Si no logras el mínimo, usa asistencia o una variante más fácil.':sw?'Primera vez: el peso sugerido es una estimación. Ajusta en la serie 1 si te sobran o faltan repeticiones.':'Primera vez: elige un peso que te deje a 2 reps del fallo.';
const ph=s?nf(s.w)+' kg':sw?nf(sw)+' kg (inicio)':L.eq==='bw'?'0 = corporal':'kg';const sugW=s?s.w:sw;const up=s&&s.type==='up'&&L.inc>0;
let st='';for(let i=0;i<it.s;i++){const p2=s&&s.L.r[i]!=null?s.L.r[i]:it.max;st+=`<div class="set ${x.d[i]?'done':''}"><div class="mut" style="font-size:11px">Serie ${i+1}</div><input id="r-${it.id}-${i}" inputmode="numeric" aria-label="Repeticiones serie ${i+1}" data-a="rep" data-id="${it.id}" data-i="${i}" value="${esc(x.r[i])}" placeholder="${p2}"><label><input type="checkbox" aria-label="Serie ${i+1} hecha" data-a="sd" data-id="${it.id}" data-i="${i}" ${x.d[i]?'checked':''}></label></div>`}

<div class="mut" style="margin-top:6px">${last}</div>${first?approach(it,L,x,s,sw):''}${s&&s.msg?`<div class="alert a-${s.type}">${s.msg}</div>`:''}
<div class="kg"><label class="mut">Peso (kg)${L.eq==='db'?' por mano':''}<input id="w-${it.id}" inputmode="decimal" data-a="w" data-id="${it.id}" value="${esc(x.w)}" placeholder="${ph}"></label><div class="mut" style="align-self:end">RIR objetivo: ${(GOALS[S.plan&&S.plan.goal]||GOALS.grasa).rir}${sugW!=null&&L.eq!=='bw'?`<br>${s?'Sugerido':'Inicio sugerido'}: <b style="color:${up?'var(--ok)':'var(--tx)'}">${nf(sugW)} kg${up?' ↑':''}</b> ${x.w===''?`<button class="ghost" data-a="usew" data-id="${it.id}">usar</button>`:''}`:''}${!s&&!sw&&L.k&&!profileReady()?'<br><button class="ghost" data-a="tab" data-t="obj">Ver peso sugerido</button>':''}</div></div>
<div class="sets">${st}</div><button class="ghost" data-a="det" data-id="${it.id}">${o?'▲ Ocultar esquema y tips':'▼ Ver esquema y tips'}</button>${o?det(L):''}</div>`}

function timeCard(){const rows=Object.keys(S.logs).filter(d=>S.logs[d].t0&&S.logs[d].t1).sort().reverse();
if(!rows.length)return `<div class="card"><b>Tiempo de tus sesiones</b><div class="mut" style="margin-top:6px">Usa ▶ Iniciar y ■ Finalizar en Hoy (o marca tu primera serie y se inicia sola). Aquí compararás el tiempo real con el estimado.</div></div>`;
let gaps=[],pres=[];const data=rows.slice(0,10).map(d=>{const l=S.logs[d],dp=dayPlan(d)||{ex:[]},real=mins(l.t1-l.t0),est=dp.ex?estMin(dp):0;
 (dp.ex||[]).forEach(it=>{const x=l.ex&&l.ex[it.id];if(!x||!x.ts)return;const ts=x.ts.filter(Boolean).sort((a,b)=>a-b);for(let i=1;i<ts.length;i++){const g=(ts[i]-ts[i-1])/1000-40;if(g>10&&g<900){gaps.push(g);pres.push(it.r)}}});
 return{d,ab:dp.ab||'',real,est,pc:Math.round(((prog(d)||{p:0}).p)*100)}});
const avR=Math.round(data.reduce((a,x)=>a+x.real,0)/data.length),avE=Math.round(data.reduce((a,x)=>a+x.est,0)/data.length),dif=avR-avE,pct=avE?Math.round(dif/avE*100):0;
const rr=gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length):null,rp=pres.length?Math.round(pres.reduce((a,b)=>a+b,0)/pres.length):null;
let tip;if(pct>15)tip=rr&&rp&&rr>rp*1.25?`Tus sesiones duran ${pct} % más de lo estimado y tus descansos reales promedian ${restTxt(rr)} frente a ${restTxt(rp)} indicados. Usa el cronómetro de descanso: es la forma más rápida de recuperar ese tiempo.`:`Tus sesiones duran ${pct} % más de lo estimado. Si no puedes acortarlas, elige un tiempo por sesión mayor en Mi objetivo para que la rutina se ajuste a tu realidad.`;
else if(pct<-15)tip=`Terminas ${Math.abs(pct)} % antes de lo estimado. ${data.some(x=>x.pc<90)?'Revisa si estás saltando series o el cardio.':'Si te sobra tiempo, puedes elegir más ejercicios por sesión o un tiempo menor en Mi objetivo.'}`;

<div class="alert ${Math.abs(pct)>15?'a-warn':'a-up'}">${tip}</div>

const SRC=[['ACSM 2026 · Posición sobre entrenamiento de fuerza','https://acsm.org/science-spotlight-acsm-releases-new-position-stand-on-resistance-training/'],['Pelland et al. 2024 · Dosis-respuesta de volumen y frecuencia','https://sportrxiv.org/index.php/server/preprint/download/460/967/908'],['Schoenfeld et al. 2016 · Frecuencia e hipertrofia','https://pubmed.ncbi.nlm.nih.gov/27102172/'],['Maeo et al. · Tríceps sobre la cabeza','https://www.ritsumei.ac.jp/shs/news/article.html/?id=680'],['ACSM 2009 · Actividad física y pérdida de peso','https://pubmed.ncbi.nlm.nih.gov/19127177/'],['OMS 2020 · Directrices de actividad física','https://www.who.int/publications/i/item/9789240015128'],['Morton et al. 2018 · Proteína y masa muscular','https://bjsm.bmj.com/content/52/6/376'],['Barakat et al. 2020 · Recomposición corporal','https://lida.sport-iat.de/ta/Record/4066252'],['Gjestvang et al. 2019 · Motivos de socios de gimnasio','https://pmc.ncbi.nlm.nih.gov/articles/PMC6500212/'],['Brobakken et al. 2023 · Reducción localizada','https://doaj.org/article/d9cf378a984146b8bc92623277623304'],['StrengthLog · Estándares de fuerza','https://www.strengthlog.com/bench-press-strength-standards/'],['Ribeiro et al. 2021 · Calentamiento y fuerza (revisión sistemática)','https://revistas.rcaap.pt/motricidade/article/view/21143'],['Behm et al. 2016 · Efectos agudos del estiramiento','https://pure.northampton.ac.uk/en/publications/acute-effects-of-muscle-stretching-on-physical-performance-range-/'],['Van Hooren y Peake 2018 · ¿Necesitamos vuelta a la calma?','https://pmc.ncbi.nlm.nih.gov/articles/PMC5999142/'],['Garber et al. 2011 · Posición ACSM (flexibilidad)','https://www.unm.edu/~lkravitz/Article%20folder/ACSMGuidelinesUNM.pdf']];
const GLOS=[['RIR (repeticiones en reserva)','Cuántas repeticiones más podrías haber hecho al terminar la serie con buena técnica. RIR 0 = fallo; RIR 2 = te quedaban 2. Quedar a 1–3 del fallo da casi el mismo resultado con menos fatiga.'],['RPE','Esfuerzo percibido de 1 a 10. RPE 8 ≈ RIR 2.'],['1RM','El peso máximo que levantas 1 vez. La app lo estima con la fórmula de Epley: peso × (1 + reps/30).'],['FC (frecuencia cardíaca)','Latidos del corazón por minuto. Se mide en LPM.'],['LPM','Latidos por minuto, la unidad de la FC.'],['FC máxima','Estimada con la fórmula de Tanaka: 208 − 0,7 × edad.'],['Zona 2','60–70 % de tu FC máxima. Cardio suave en que puedes hablar con frases cortas; mejora la base aeróbica y casi no interfiere con la fuerza.'],['HIIT','Intervalos de alta intensidad (85–95 % de FC máx) con pausas suaves. Mucho gasto en poco tiempo y mejora la capacidad de sprints repetidos.'],['Serie efectiva','Serie terminada cerca del fallo (RIR 0–3). Las series de calentamiento no cuentan.'],['Volumen semanal','Series efectivas por músculo en la semana. Es la variable que más explica la hipertrofia.'],['Frecuencia','Veces por semana que entrenas un músculo. Lo recomendado es 2 o más.'],['Sobrecarga progresiva','Aumentar de a poco peso, reps o series. Si completas el tope del rango en todas las series, sube el peso.'],['Descarga','Semana con la mitad de las series para recuperarte. La app la sugiere cada 7 semanas.'],['Posición estirada','Ejercicios que cargan el músculo cuando está más largo (curl inclinado, extensión sobre la cabeza). Suelen producir más crecimiento.'],['Déficit calórico','Comer menos de lo que gastas. Es lo que reduce la grasa; no se puede quemar grasa solo de una zona.'],['Metabolismo basal','Energía que gastas en reposo. La app usa la fórmula de Mifflin-St Jeor.'],['Entrenamiento concurrente','Combinar fuerza con otro deporte o cardio. Funciona bien si separas los días pesados de piernas de los partidos.']];
function vTeo(){const pl=S.plan,g=(pl&&pl.goal)||P().goal||'grasa',G=GOALS[g];const{s}=weekSets(pl);
return `<h1>📚 Teoría</h1><p class="mut">Definiciones y la evidencia que respalda tu rutina.</p>
<details><summary>Aviso importante</summary><div><p>${DISC}</p>${S.consent&&S.consent.flag?'<p class="alert a-bad">En el cuestionario de salud respondiste "Sí" a alguna pregunta: entrena con autorización médica.</p>':''}</div></details>
<details open><summary>Base científica de tu rutina</summary><div>${pl?`<p><b>${esc(pl.name)}</b> · objetivo: ${G.n}</p><ul>${G.why.map(x=>`<li>${x}</li>`).join('')}<li>Repeticiones: ejercicios básicos ${G.comp[0]}–${G.comp[1]}, aislamiento ${G.iso[0]}–${G.iso[1]}, a RIR ${G.rir}.</li><li>Cardio: ${cardioWeek(pl)} min/semana${g==='salud'?' (meta OMS: 150–300)':''}.</li><li>Duración: cada sesión dura lo que elegiste en Mi objetivo, incluidos 13 min de calentamiento y vuelta a la calma. Más tiempo no significa más series: sobre ~10–20 series semanales por músculo el beneficio extra es pequeño, así que el tiempo sobrante se usa en cardio cuando tu objetivo lo pide.</li></ul>${volTable(pl,g)}`:'<p class="mut">Cuando tengas una rutina, aquí verás sus series por músculo comparadas con lo recomendado.</p>'}</div></details>
<details><summary>Series por músculo, prioridades y ejercicios por sesión</summary><div><ul><li>El volumen semanal (series efectivas por músculo) es lo que más explica la hipertrofia; el beneficio crece hasta ~10–20 series y sobre eso los retornos son pequeños (Pelland 2024; ACSM 2026: al menos ~10).</li><li>Un grupo <b>prioritario</b> recibe más volumen a propósito: su mínimo sube 2 series y su máximo llega hasta 20 series por semana. Los demás grupos quedan en su rango normal, lo que permite recuperarse.</li><li>La app nunca supera el máximo de cada grupo. Si una combinación deja un grupo bajo el mínimo, la propuesta lo avisa.</li><li><b>Ejercicios por sesión</b> no cambia las series semanales, solo cómo se reparten: con menos ejercicios cada uno lleva más series (máx. 5), y con más ejercicios, menos series cada uno. En una sesión, más de ~6–8 series por músculo aporta poco extra (Pelland 2024: ~11 series fraccionales por sesión).</li></ul></div></details>
<details><summary>Calentamiento y vuelta a la calma</summary><div><p><b>Antes (8 min):</b></p><ul><li>5 min de cardio suave (50–60 % de tu FC máx) para subir la temperatura muscular. ACSM recomienda 5–10 min de calentamiento en cada sesión.</li><li>Movilidad dinámica de las articulaciones que vas a usar. Los estiramientos estáticos largos (60 s o más por músculo) bajan el rendimiento en ~4,6 %; menos de 60 s casi no afectan (~1,1 %), y los dinámicos lo mejoran levemente (Behm 2016).</li><li>Series de aproximación en el primer ejercicio de cada grupo: 10 reps al 50 % y 5 al 70 % del peso de trabajo, más 3 al 85 % si vas a hacer 6 reps o menos. El calentamiento específico con cargas cercanas a las de trabajo favorece la fuerza y las repeticiones (Ribeiro 2021).</li></ul><p><b>Después (5 min):</b></p><ul><li>2–3 min caminando suave. La vuelta a la calma no acelera la recuperación ni evita el dolor del día siguiente, pero tampoco perjudica (Van Hooren y Peake 2018).</li><li>Estiramiento estático de lo que entrenaste: 2–4 repeticiones de 10–30 s, unos 60 s por músculo, al menos 2–3 días por semana. Esto mejora la flexibilidad (ACSM, Garber 2011).</li></ul></div></details>
<details><summary>Glosario</summary><div><dl>${GLOS.map(([t,d])=>`<dt>${t}</dt><dd>${d}</dd>`).join('')}</dl></div></details>
<details><summary>Objetivos más comunes y qué dice la evidencia</summary><div><p class="mut">En un estudio con 125 nuevos socios de gimnasios (BMJ Open 2019), los motivos más citados fueron mejorar la condición física (93 %), tener un cuerpo sano (66 %), sentirse mejor (65 %), verse más atractivo (58 %), mejorar la resistencia (50 %), bajar de peso (46 %) y desarrollar músculo (43 %).</p>
${Object.keys(GOALS).map(k=>`<p><b>${GOALS[k].n}</b><br>${GOALS[k].why[0]} Reps: básicos ${GOALS[k].comp[0]}–${GOALS[k].comp[1]}, aislamiento ${GOALS[k].iso[0]}–${GOALS[k].iso[1]}. Series/semana por músculo: ${GOALS[k].rng[0]}–${GOALS[k].rng[1]}.</p>`).join('')}</div></details>
<details><summary>Cómo se calcula el peso inicial</summary><div><ol><li>Se estima tu 1RM con tu peso corporal y estándares de fuerza por ejercicio, ajustado por nivel (principiante ×1, intermedio ×1,3, avanzado ×1,7), sexo y edad.</li><li>Se convierte al rango de repeticiones del ejercicio dejando 2 en reserva (Epley): 1RM × 30 / (30 + reps + 2).</li><li>Si eres principiante se resta un 10 % extra y se redondea a los discos o mancuernas habituales.</li></ol><p class="mut">Es una estimación conservadora. La primera sesión sirve para calibrar: si te sobran más de 2 reps, sube; si no llegas al mínimo, baja. Desde la segunda sesión la app usa tu historial.</p></div></details>
<details><summary>Fuentes</summary><div><ul>${SRC.map(([t,u])=>`<li><a href="${u}" target="_blank" rel="noopener" style="color:var(--acc2)">${t}</a></li>`).join('')}</ul></div></details>`}

function stopTimer(){clearInterval(tmI);timer.hidden=true;tmNext=null}
function startTimer(sec,label,next){const end=Date.now()+sec*1000,tok=++tmTok;clearInterval(tmI);tmNext=next||null;timer.hidden=false;timer.className='timer'+(next?' tr':'');
const tick=()=>{const r=Math.max(0,Math.round((end-Date.now())/1000));if(r>0)timer.innerHTML=`⏱ ${restTxt(r)} · ${esc(label)}<small>${next?'Toca para ir al siguiente ejercicio':'Toca para cerrar'}</small>`;else{clearInterval(tmI);timer.innerHTML=next?`▶ ¡Vamos con ${esc(LIB[next]?LIB[next].n:'el cardio')}!<small>Toca para ir</small>`:'✅ ¡A la siguiente serie!';beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);setTimeout(()=>{if(tok===tmTok)timer.hidden=true},6000)}};tick();tmI=setInterval(tick,500)}
timer.onclick=()=>{const n=tmNext;stopTimer();if(n){const el=document.getElementById('ex-'+n);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}};

const nx=list.slice(idx+1).find(pend)||list.slice(0,idx).find(pend);
if(nx){startTimer(Math.min(nx.r,120),`Cambio de ejercicio → ${LIB[nx.id].n}`,nx.id);return}

case'parq':{parq[+t.dataset.q]=t.dataset.v;if(!parq.includes('si'))acc.a3=false;render();break}
case'startApp':{if(parq.includes('')||!acc.a1||!acc.a2||(parq.includes('si')&&!acc.a3))break;S.consent={date:new Date().toISOString(),flag:parq.includes('si'),v:1};S.settings.start=todayCL();tab='obj';dirty=true;save();window.scrollTo(0,0);break}
case'prev':sel=add(sel,-1);render();break;
case'next':sel=add(sel,1);render();break;
case'today':sel=todayCL();render();window.scrollTo(0,0);break;
case'goto':sel=t.dataset.d;render();break;
case'sheet':showSheet=true;calM=sel.slice(0,7);renderSheet();break;
case'tab':setTab(t.dataset.t);break;
case'goData':setTab('pro');setTimeout(()=>{const el=document.getElementById('datos');if(el)el.scrollIntoView({behavior:'smooth'})},50);break;
case'det':openDet[t.dataset.id]=!openDet[t.dataset.id];render();break;
case'usew':{const dp=dayPlan(sel),it=dp&&dp.ex.find(x=>x.id===t.dataset.id);if(!it)break;const s=sugg(it,sel),w=s?s.w:startW(it);if(w!=null){exLog(sel,it,true).w=String(w);mark();render()}break}
case'prio':{const k=t.dataset.k,p=S.profile.prio;const i=p.indexOf(k);if(i>=0)p.splice(i,1);else{if(p.length>=3){toast('Elige hasta 3 grupos prioritarios.');break}p.push(k)}mark();render();break}
case'avd':{const w=+t.dataset.w,p=S.profile;p.availDays=p.availDays.map(Number);const i=p.availDays.indexOf(w);if(i>=0)p.availDays.splice(i,1);else p.availDays.push(w);mark();render();break}
case'spd':{const w=+t.dataset.w,p=S.profile;p.sportDays=p.sportDays.map(Number);const i=p.sportDays.indexOf(w);if(i>=0)p.sportDays.splice(i,1);else p.sportDays.push(w);mark();render();break}
case'gen':{const m=missing();if(m.length){toast('Falta completar: '+m.join(', '));break}{const pp=P(),sdx=(pp.sport&&pp.sport!=='ninguno')?pp.sportDays.map(Number):[],free=pp.availDays.map(Number).filter(w=>!sdx.includes(w)).length;if(free<+pp.days)toast(`Tienes ${free} días libres para el gimnasio (sin contar tu deporte); armé la rutina con ${free}.`)}prop={plan:genPlan(P())};render();setTimeout(()=>{const el=document.getElementById('prop');if(el)el.scrollIntoView({behavior:'smooth'})},50);break}
case'apply':{S.plan=prop.plan;delete S.plan.short;delete S.plan.warn;const nu=nutri(P(),S.plan);if(nu){S.settings.kcal=nu.kcal;S.settings.prot=nu.prot}refreshSnaps();prop=null;ed=null;mark();persist();render();toast('Rutina activada ✅ Ya la ves en Hoy.');break}
case'discard':prop=null;render();break;
case'editProp':ed=clone(prop.plan);ed.src='manual';prop=null;edGrp={};render();setTimeout(()=>{const el=document.getElementById('editor');if(el)el.scrollIntoView({behavior:'smooth'})},50);break;
case'edEdit':ed=clone(S.plan);edGrp={};render();setTimeout(()=>{const el=document.getElementById('editor');if(el)el.scrollIntoView({behavior:'smooth'})},50);break;
case'edNew':ed={name:'Mi rutina personalizada',src:'manual',goal:P().goal||'musculo',days:[{wd:1,n:'Día 1',ab:'D1',ex:[],cardio:null}]};edGrp={};render();setTimeout(()=>{const el=document.getElementById('editor');if(el)el.scrollIntoView({behavior:'smooth'})},50);break;
case'edAdd':{const i=+t.dataset.i,sel2=document.getElementById('ed-x-'+i);if(!sel2||!sel2.value)break;const d=ed.days[i];if(d.ex.some(e=>e.id===sel2.value)){toast('Ese ejercicio ya está en este día.');break}d.ex.push(defItem(sel2.value));render();break}
case'edUp':case'edDown':{const d=ed.days[+t.dataset.i],j=+t.dataset.j,k=a==='edUp'?j-1:j+1;if(k<0||k>=d.ex.length)break;[d.ex[j],d.ex[k]]=[d.ex[k],d.ex[j]];render();break}
case'edDel':ed.days[+t.dataset.i].ex.splice(+t.dataset.j,1);render();break;
case'edAddDay':{const used=ed.days.map(d=>+d.wd);const w=[1,2,3,4,5,6,0].find(x=>!used.includes(x));ed.days.push({wd:w,n:'Día '+(ed.days.length+1),ab:'D'+(ed.days.length+1),ex:[],cardio:null});render();break}
case'edDelDay':if(arm(t,'¿Quitar?')){ed.days.splice(+t.dataset.i,1);render()}break;
case'edCancel':ed=null;render();break;
case'edSave':{const ws=ed.days.map(d=>+d.wd);if(!ed.days.length){toast('Agrega al menos un día.');break}if(new Set(ws).size!==ws.length){toast('Dos días usan el mismo día de la semana.');break}if(ed.days.some(d=>!d.ex.length&&!d.cardio)){toast('Cada día necesita al menos un ejercicio o cardio.');break}
ed.days.forEach(d=>{if(d.ab&&!/^D\d+$/.test(d.ab))return d.ex.forEach(e=>{if(e.min>e.max)[e.min,e.max]=[e.max,e.min]});d.ab=(d.n||'Día').replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñ0-9+ -]/g,'').split(/\s+/).filter(Boolean).map((w,i)=>i?w[0]:w.slice(0,4)).join('').slice(0,5)||'Día';d.ex.forEach(e=>{if(e.min>e.max)[e.min,e.max]=[e.max,e.min]})});
ed.src='manual';S.plan=ed;ed=null;refreshSnaps();mark();persist();render();toast('Rutina guardada ✅');break}
case'spadd':S.supps.push({id:'s'+Date.now(),name:'Nuevo suplemento',dose:1,unit:'u'});mark();render();break;
case'spdel':if(arm(t,'¿Borrar?')){S.supps=S.supps.filter(z=>z.id!==t.dataset.id);mark();render()}break;
case'useNu':{const nu=nutri(P(),S.plan);if(nu){S.settings.kcal=nu.kcal;S.settings.prot=nu.prot;mark();render()}break}
case'dl':{if(!DL){try{const bl=new Blob([JSON.stringify(S)],{type:'application/json'}),u=document.createElement('a');u.href=URL.createObjectURL(bl);u.download=fileName();document.body.appendChild(u);u.click();setTimeout(()=>{URL.revokeObjectURL(u.href);u.remove()},1500);markBackup();toast('Respaldo descargado ✅')}catch(e){toast('No se pudo descargar. Usa "Copiar código".')}break}DL.save({filename:fileName(),data:JSON.stringify(S)}).then(()=>{markBackup();toast('Respaldo descargado ✅')}).catch(e=>{if(e&&e.code==='declined')return;toast('No se pudo descargar. Usa "Copiar código".')});break}
case'exp':{const j=JSON.stringify(S);showExp=false;try{navigator.clipboard.writeText(j).then(()=>{markBackup();toast('Código copiado. Pégalo en Notas o envíatelo por correo.')}).catch(()=>{showExp=true;render()})}catch(e){showExp=true;render()}break}
case'impt':showImp=!showImp;render();break;
case'restore':{const v=$('#impTxt').value.trim();restore(v);break}
case'imp':$('#imp').click();break;
case'reset':if(arm(t,'Toca otra vez para borrar todo')){S=def();prop=null;ed=null;parq=PARQ.map(()=>'');acc={a1:false,a2:false,a3:false};dirty=true;save();toast('Datos borrados.')}break;
}});
$('#sheet').addEventListener('click',ev=>{if(ev.target.id==='sheet'){showSheet=false;renderSheet();return}const t=ev.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
if(a==='close'){showSheet=false;renderSheet()}else if(a==='pick'){sel=t.dataset.d;showSheet=false;tab='hoy';render();window.scrollTo(0,0)}else if(a==='cprev'||a==='cnext'){const[y,m]=calM.split('-').map(Number);calM=ds(new Date(Date.UTC(y,m-1+(a==='cnext'?1:-1),1))).slice(0,7);renderSheet()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&showSheet){showSheet=false;renderSheet()}});
$('#imp').addEventListener('change',ev=>{const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{restore(rd.result);ev.target.value=''};rd.readAsText(f)});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$('#saveBtn').onclick=()=>{save();toast(isLocal()?'Guardado en este equipo ✅':'Guardado ✅')};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty)persist()});
window.addEventListener('pagehide',()=>{if(dirty)persist()});
render();updSave();initCloud();
</script>
